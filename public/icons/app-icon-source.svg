<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Fond violet arrondi -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="300" rx="115" fill="url(#shine)"/>

  <!-- Sac shopping blanc, centré, épuré -->
  <!-- Corps du sac -->
  <rect x="134" y="224" width="244" height="184" rx="22"
        fill="none" stroke="white" stroke-width="26" stroke-linejoin="round"/>
  <!-- Anse gauche -->
  <path d="M192 224 L192 178 Q192 140 256 140 Q320 140 320 178 L320 224"
        fill="none" stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lettre S blanche centrée dans le sac -->
  <text x="256" y="342"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="108"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-2">S</text>
</svg>
