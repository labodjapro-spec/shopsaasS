<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond violet gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Reflet léger -->
  <rect width="512" height="256" rx="112" fill="url(#shineGrad)"/>

  <!-- Sac shopping (contour blanc) -->
  <path d="M176 208 L160 352 C158 366 169 378 183 378 L329 378 C343 378 354 366 352 352 L336 208 Z"
        fill="none" stroke="white" stroke-width="20" stroke-linejoin="round"/>
  <!-- Anse du sac -->
  <path d="M210 208 C210 170 302 170 302 208"
        fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Lettre S -->
  <text x="256" y="318"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="120"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle">S</text>
</svg>
